name: Compile binaries
on:
  workflow_dispatch:

jobs:
  preflight:
    name: Determine what needs to be built
    runs-on: ubuntu-latest
    outputs:
      darwin: ${{ steps.missing.outputs.darwin }}
      linux: ${{ steps.missing.outputs.linux }}
      win32: ${{ steps.missing.outputs.win32 }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Compare the draft release's assets to the full list
      id: missing
      shell: bash # the implicit default omits `pipefail`, hiding a failed release lookup behind `tee`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node lib/prebuild.mjs missing \
          | jq -r 'to_entries[] | "\(.key)=\(.value|tojson)"' \
          | tee -a "$GITHUB_OUTPUT"

  mac:
    needs: preflight
    if: ${{ needs.preflight.outputs.darwin != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.darwin) }}
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Use Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Build module
      env:
        MACOSX_DEPLOYMENT_TARGET: 10.14
      run: make optimized

    - name: Add to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm test && npm run upload

  windows:
    needs: preflight
    if: ${{ needs.preflight.outputs.win32 != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.win32) }}
    runs-on: ${{ matrix.arch == 'x64' && 'windows-latest' || 'windows-11-arm' }}

    steps:
    - name: Enable long paths
      run: git config --system core.longpaths true

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Use Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Build module
      run: make optimized

    - name: Add to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm config set script-shell bash
        npm test && npm run upload


  linux:
    needs: preflight
    if: ${{ needs.preflight.outputs.linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.linux) }}
    runs-on: ${{ matrix.arch == 'x64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    container:
      image: ${{ format('ghcr.io/{0}-{1}:2026.09', github.repository, matrix.libc) }}
    env:
      ORAS_VERSION: 1.3.4

    steps:
    - name: Install rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        echo CARGO_TERM_COLOR=always >> $GITHUB_ENV

    - name: Checkout skia-canvas
      id: skia-canvas
      env:
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref_name }}
      run: |
        git clone --depth 1 --branch $REF ${SERVER}/${REPO} skia-canvas
        echo "skia-version=$(make -sC skia-canvas skia-version)" >> $GITHUB_OUTPUT

    - name: Restore compiled Skia
      id: skia-cache
      env:
        CACHE_REF: ghcr.io/${{ github.repository }}-cache:${{ matrix.libc }}-${{ matrix.arch }}-${{ steps.skia-canvas.outputs.skia-version }}-${{ hashFiles('skia-canvas/containers/**') }}
        CR_PAT: ${{ secrets.CR_PAT }}
      run: |
        case "${{ matrix.arch }}" in x64) ARCH=amd64 ;; *) ARCH=arm64 ;; esac
        curl -sSL "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_$ARCH.tar.gz" \
          | tar xz -C /usr/local/bin oras
        echo "$CR_PAT" | oras login ghcr.io -u ${{ github.repository_owner }} --password-stdin
        echo "ref=$CACHE_REF" >> $GITHUB_OUTPUT

        mkdir -p /tmp/skia-binaries
        if oras pull "$CACHE_REF" -o /tmp/skia-binaries; then
          echo "hit=true" >> $GITHUB_OUTPUT
        else
          echo "no cached Skia for $CACHE_REF — building from source"
        fi

    - name: Checkout rust-skia and apply static deps patch
      env:
        TAG: ${{ steps.skia-canvas.outputs.skia-version }}
        CACHED: ${{ steps.skia-cache.outputs.hit }}
      run: |
        SUBMODULES=""
        [ "$CACHED" = "true" ] || SUBMODULES="--recurse-submodules -j8"
        git clone --depth 1 --branch "$TAG" $SUBMODULES https://github.com/rust-skia/rust-skia.git
        patch -d rust-skia -p1 -F10 < ./skia-canvas/containers/use-static-fontconfig.patch

    - name: Use cached Skia
      if: ${{ steps.skia-cache.outputs.hit == 'true' }}
      run: |
        echo "FORCE_SKIA_BINARIES_DOWNLOAD=1" >> $GITHUB_ENV
        echo "SKIA_BINARIES_URL=file:///tmp/skia-binaries/skia.tar.gz" >> $GITHUB_ENV

    - name: Build module
      run: |
        make -sC skia-canvas with-local-skia
        cd skia-canvas && make optimized && npm test

    - name: Save Skia for later runs
      if: ${{ steps.skia-cache.outputs.hit != 'true' }}
      env:
        CACHE_REF: ${{ steps.skia-cache.outputs.ref }}
      run: |
        out=$(find skia-canvas/target/release/build -maxdepth 3 -type d -path '*skia-bindings-*/out/skia' | head -1)
        [ -n "$out" ] || { echo "no skia build output to cache"; exit 1; }
        mkdir -p /tmp/pkg/skia-binaries
        cp "$out"/*.a "$out"/bindings.rs /tmp/pkg/skia-binaries/
        tar czf /tmp/skia.tar.gz -C /tmp/pkg skia-binaries
        cd /tmp && oras push "$CACHE_REF" skia.tar.gz

    - name: Add AWS layer to release
      if: ${{ matrix.libc == 'glibc' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export SRC_DIR="$GITHUB_WORKSPACE/skia-canvas"
        export SRC_DIST="$SRC_DIR/$(cd $SRC_DIR; npm pack)"
        export LAYER_DIR="$GITHUB_WORKSPACE/layer"
        export LAYER_ZIP="$GITHUB_WORKSPACE/aws-lambda-${{ matrix.arch }}.zip"
        export PKG_VERSION=v$(cd $SRC_DIR; npm pkg get version | tr -d '"')

        mkdir -p $LAYER_DIR/nodejs
        cd $LAYER_DIR/nodejs && \
           npm install --ignore-scripts $SRC_DIST && \
           cp $SRC_DIR/lib/skia.node ./node_modules/skia-canvas/lib
        cd $LAYER_DIR && \
           zip -r9 $LAYER_ZIP nodejs/node_modules
        gh release -R samizdatco/skia-canvas upload $PKG_VERSION $LAYER_ZIP --clobber

    - name: Add module to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd skia-canvas && npm run upload

  verify:
    name: Verify release assets
    needs: [mac, windows, linux]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci --ignore-scripts

    # a dry run of publish.yml's first two steps: `packages` names any missing triplet and
    # exits non-zero, so the draft can't be published with an incomplete set of binaries
    - name: Collect release assets & assemble platform packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node lib/prebuild.mjs collect assets
        node lib/prebuild.mjs packages
