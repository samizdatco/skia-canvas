name: Publish to NPM
on:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Collect release assets & integrity hashes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node lib/prebuild.mjs collect assets

    - name: Assemble platform packages & pin optionalDependencies
      run: node lib/prebuild.mjs packages

    # the platform-specific packages all need to be published before the main skia-canvas package
    - name: Publish @skia-canvas/<platform> packages to NPM
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        VERSION=$(npm pkg get version | tr -d '"')
        for pkg in assets/npm/*/ ; do
          NAME=$(node -p "require('./$pkg/package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — skipping"
          else
            npm publish "./$pkg"
          fi
        done

    - name: Publish skia-canvas to NPM
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        npm publish
