name: Publish to NPM
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Collect release assets & integrity hashes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node lib/prebuild.mjs collect assets

    - name: Assemble platform packages & pin optionalDependencies
      run: node lib/prebuild.mjs packages

    # the platform-specific packages all need to be published before the main skia-canvas package
    - name: Publish @skia-canvas/<platform> packages to NPM
      shell: bash # for pipefail
      run: |
        VERSION=$(npm pkg get version | tr -d '"')
        if [[ $VERSION == *-* ]]; then TAG_FLAG="--tag next"; else TAG_FLAG=""; fi
        for pkg in assets/npm/*/ ; do
          NAME=$(node -p "require('./$pkg/package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published — skipping"
          else
            npm publish $TAG_FLAG "./$pkg"
          fi
        done

    - name: Publish skia-canvas to NPM
      shell: bash # for pipefail
      run: |
        VERSION=$(npm pkg get version | tr -d '"')
        if [[ $VERSION == *-* ]]; then
          npm publish --tag next
        else
          npm publish
          # try to keep `next` pointing at the newest published version even for stable releases
          # (OIDC will prevent this until npm/cli#8547 so it will just log a warning for now)
          npm dist-tag add "skia-canvas@$VERSION" next || echo "::warning::dist-tag add failed for skia-canvas@$VERSION (npm/cli#8547) — re-point next manually"
        fi
