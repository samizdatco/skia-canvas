name: Build containers
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag, e.g. 2026.09 (also moves :latest)'
        required: true

jobs:
  # run arm & intel builds on native runners create 4 single-arch images
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: containers
        file: containers/Dockerfile.${{ matrix.libc }}
        platforms: linux/${{ matrix.platform.arch }}
        cache-from: type=gha,scope=${{ matrix.libc }}-${{ matrix.platform.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.libc }}-${{ matrix.platform.arch }}
        outputs: type=image,name=ghcr.io/${{ github.repository }}-${{ matrix.libc }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"   # filename is the bare hex; merge re-adds sha256:

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ matrix.libc }}-${{ matrix.platform.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  # join the independent images into two multi-arch manifests (glibc & musl)
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]

    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-${{ matrix.libc }}-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}

    - name: Create multi-arch manifest and push
      working-directory: /tmp/digests
      env:
        IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.libc }}
        VERSION: ${{ inputs.version }}
      run: |
        docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$VERSION" \
          $(printf "$IMAGE@sha256:%s " *)

    - name: Inspect manifest
      env:
        IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.libc }}
        VERSION: ${{ inputs.version }}
      run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # try running the linux builds inside the new container images
  test:
    runs-on: ${{ matrix.platform.runner }}
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    container:
      image: ghcr.io/${{ github.repository }}-${{ matrix.libc }}:${{ inputs.version }}

    steps:
    - name: Install rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        echo CARGO_TERM_COLOR=always >> $GITHUB_ENV

    - name: Checkout skia-canvas
      env:
        SERVER: ${{ github.server_url }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref_name }}
      run: |
        git clone --depth 1 --branch $REF ${SERVER}/${REPO} skia-canvas

    - name: Checkout rust-skia and apply static deps patch
      run: |
        export TAG=$(make -sC skia-canvas skia-version)
        git clone --depth 1 --branch $TAG --recurse-submodules -j8 https://github.com/rust-skia/rust-skia.git
        patch -d rust-skia -p1 -F10 < ./skia-canvas/containers/use-static-fontconfig.patch

    - name: Build module
      run: |
        make -sC skia-canvas with-local-skia
        cd skia-canvas && make optimized

    - name: Run tests
      run: |
        cd skia-canvas && npm test
