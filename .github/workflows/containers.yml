name: Build containers
on:
  workflow_dispatch:

jobs:
  # run arm & intel builds on native runners create 4 single-arch images
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: containers
        file: containers/Dockerfile.${{ matrix.libc }}
        platforms: linux/${{ matrix.platform.arch }}
        cache-from: type=gha,scope=${{ matrix.libc }}-${{ matrix.platform.arch }}
        cache-to: type=gha,mode=max,scope=${{ matrix.libc }}-${{ matrix.platform.arch }}
        outputs: type=image,name=ghcr.io/${{ github.repository }}-${{ matrix.libc }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"   # filename is the bare hex; merge re-adds sha256:

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.libc }}-${{ matrix.platform.arch }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  # join the independent images into two multi-arch manifests (glibc & musl)
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]

    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-${{ matrix.libc }}-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}

    - name: Create multi-arch manifest and push
      working-directory: /tmp/digests
      env:
        IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.libc }}
      run: |
        docker buildx imagetools create -t "$IMAGE:latest" \
          $(printf "$IMAGE@sha256:%s " *)

    - name: Inspect manifest
      env:
        IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.libc }}
      run: docker buildx imagetools inspect "$IMAGE:latest"
