[package]
name = "skia-canvas"
version = "3.0.8"
description = "A canvas environment for Node"
authors = ["Christian Swinehart <drafting@samizdat.co>"]
license = "MIT"
edition = "2024"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "fat"

[features]
freetype = ["skia-safe/embed-freetype", "skia-safe/freetype-woff2"]
metal = ["skia-safe/metal", "dep:raw-window-metal", "dep:objc2", "dep:objc2-core-foundation", "dep:objc2-metal", "dep:objc2-quartz-core", "dep:objc2-core-graphics", "objc2-quartz-core/objc2-core-graphics"]
vulkan = ["skia-safe/vulkan", "winit/rwh_05", "dep:ash", "dep:vulkano"]
window = ["dep:winit", "dep:spin_sleep", "dep:drm", "dep:objc2-core-foundation", "dep:objc2-core-video"]

[dependencies]
neon = { version = "1.0", features = ["sys"] }
libc = "0.2"
libloading = "0.8"
crc = "^3.0"
rayon = "^1.5"
crossbeam = "0.8.2"
once_cell = "1.13"
little_exif = "0.6.8"
dashmap = "6.1.0"
process_path = "0.1.4"
roxmltree = "0.20"
simplecss = { path = "vendor/simplecss" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
allsorts = { version = "0.17", features = ["flate2_zlib"], default-features = false}
skia-safe = { version = "0.99.0", features = ["textlayout", "webp", "svg"] }

# vulkan
ash = { version = "0.38.0", optional = true }
vulkano = { version = "0.35.2", optional = true }

# metal
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true, default-features = false, features = ["std", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLDrawable", "MTLPixelFormat", "MTLTexture"] }
objc2-quartz-core = { version = "0.3", optional = true, default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-metal", "objc2-core-foundation"] }
raw-window-metal = { version = "1.1", optional = true }

# window
winit = { version = '0.30.13', features = ["serde"], optional = true }
spin_sleep = {version = "1.2.1", optional = true }
color = "0.3"

# window: X11/Linux vblank source (drm-rs). Linux-only, so it never touches the macOS/Windows
# builds; pulled in only with the `window` feature.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
drm = { version = "0.15", optional = true }

# macOS-only: CoreFoundation types shared by the `metal` renderers and the `window` feature's
# vblank source (CVDisplayLink), which also needs CoreVideo (+ CoreGraphics for CGDirectDisplayID)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = ["std", "CVBase", "CVReturn", "CVDisplayLink", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = ["std", "CGColorSpace"] }
